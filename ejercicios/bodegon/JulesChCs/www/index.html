<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sala</title>

        .rectanglesofa{

            right: 23%;
            bottom: 25%;

            right: 19%;

        }
        .cuadro_borde{
            position: absolute;

            position: absolute;
            height: 325px;

        }
        .lampara1{
            border-bottom: 60px solid beige;

            border-right: 20px solid transparent;
            width: 125px;
            rotate: 180deg;

            left: 10%;
        }
        
    </style>

</head>
<body >
    <div class="rectanglesofa"></div>
